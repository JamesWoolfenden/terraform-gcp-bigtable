id: HLD_PROPOSED_001
name: Bigtable table IAM bindings must not grant access to allUsers or allAuthenticatedUsers
principle: network-security
severity: CRITICAL
rationale: |
  allUsers grants access to anyone on the internet with no Google account required.
  allAuthenticatedUsers grants access to any of the 3+ billion Google account holders
  globally. Granting either on a google_bigtable_table_iam_binding or
  google_bigtable_table_iam_member exposes the table's data (rows, column families,
  and cell values) without authentication, independent of any project- or
  instance-level IAM restrictions.
remediation: Remove allUsers and allAuthenticatedUsers from the members/member attribute on the Bigtable table IAM binding or member resource.
resources:
  google_bigtable_table_iam_member:
    path: member
    not_one_of: ["allUsers", "allAuthenticatedUsers"]
  google_bigtable_table_iam_binding:
    path: members
    not_contains: "allUsers"
